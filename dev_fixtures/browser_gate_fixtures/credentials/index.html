<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Credentials Gate Fixture</title>
</head>
<body>
  <div id="login-form">
    <label>用户名 <input id="user" type="text" autocomplete="username" /></label>
    <label>密码 <input id="pass" type="password" autocomplete="current-password" /></label>
    <button id="submit" type="button">登录</button>
  </div>
  <div id="logged-in" hidden>
    <p>登录成功</p>
    <p id="welcome-msg"></p>
  </div>
  <script>
    document.getElementById("submit").addEventListener("click", function () {
      var u = document.getElementById("user").value.trim();
      var p = document.getElementById("pass").value;
      if (u === "testuser" && p === "testpass") {
        document.getElementById("login-form").hidden = true;
        document.getElementById("logged-in").hidden = false;
        document.getElementById("welcome-msg").textContent = "欢迎，" + u;
      } else {
        alert("用户名或密码错误（fixture: testuser / testpass）");
      }
    });
  </script>
</body>
</html>
