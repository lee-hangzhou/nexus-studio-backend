<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Unsupported Geometry</title>
  <style>
    #challenge-box { width: 200px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
    #slider-track {
      position: relative; width: 40px; height: 220px; margin: 12px auto;
      background: #e8e8e8; border-radius: 4px;
    }
    #slider-thumb {
      position: absolute; left: 0; top: 0; width: 40px; height: 40px;
      background: #1677ff; border-radius: 4px; color: #fff; line-height: 40px; text-align: center;
    }
    .ok { color: #389e0d; display: none; margin-top: 12px; text-align: center; }
    .hint { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div id="challenge-box">
    <p>竖向滑块（v1 不支持）</p>
    <p class="hint">capture 应返回 unsupported_slider_geometry</p>
    <div id="slider-track">
      <div id="slider-thumb" role="slider">↓</div>
    </div>
    <p class="ok" id="success-msg">验证通过</p>
  </div>
</body>
</html>
