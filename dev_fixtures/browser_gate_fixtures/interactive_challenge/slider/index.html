<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Slider Challenge Fixture</title>
  <style>
    #challenge-box {
      width: 320px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }
    #slider-track {
      position: relative;
      height: 40px;
      background: #e8e8e8;
      border-radius: 4px;
      margin-top: 12px;
    }
    #slider-thumb {
      position: absolute;
      left: 0;
      top: 0;
      width: 40px;
      height: 40px;
      background: #1677ff;
      border-radius: 4px;
      cursor: grab;
      color: #fff;
      line-height: 40px;
      text-align: center;
      user-select: none;
    }
    #slider-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 40px;
      width: 0;
      background: #91caff;
      border-radius: 4px;
      pointer-events: none;
    }
    .ok { color: #389e0d; display: none; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="challenge-box">
    <p>请拖动滑块至最右侧完成验证</p>
    <div id="slider-track">
      <div id="slider-fill"></div>
      <div id="slider-thumb" role="slider" aria-valuemin="0" aria-valuemax="100">→</div>
    </div>
    <p class="ok" id="success-msg">验证通过</p>
  </div>
  <script>
    (function () {
      var track = document.getElementById("slider-track");
      var thumb = document.getElementById("slider-thumb");
      var fill = document.getElementById("slider-fill");
      var maxX = track.clientWidth - thumb.clientWidth;
      var dragging = false;
      var startX = 0;
      var startLeft = 0;

      function setPos(x) {
        var left = Math.max(0, Math.min(x, maxX));
        thumb.style.left = left + "px";
        fill.style.width = (left + thumb.clientWidth / 2) + "px";
        if (left >= maxX - 2) {
          document.getElementById("success-msg").style.display = "block";
          thumb.textContent = "✓";
        }
      }

      thumb.addEventListener("mousedown", function (e) {
        dragging = true;
        startX = e.clientX;
        startLeft = parseInt(thumb.style.left || "0", 10);
        e.preventDefault();
      });
      document.addEventListener("mousemove", function (e) {
        if (!dragging) return;
        setPos(startLeft + e.clientX - startX);
      });
      document.addEventListener("mouseup", function () {
        dragging = false;
      });
      thumb.addEventListener("touchstart", function (e) {
        dragging = true;
        startX = e.touches[0].clientX;
        startLeft = parseInt(thumb.style.left || "0", 10);
      });
      document.addEventListener("touchmove", function (e) {
        if (!dragging) return;
        setPos(startLeft + e.touches[0].clientX - startX);
      });
      document.addEventListener("touchend", function () {
        dragging = false;
      });
    })();
  </script>
</body>
</html>
