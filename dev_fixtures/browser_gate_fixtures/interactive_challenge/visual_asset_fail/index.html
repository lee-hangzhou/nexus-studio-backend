<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Visual Asset Fail</title>
  <style>
    #challenge-box { width: 320px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
    #slider-track { position: relative; height: 40px; background: #e8e8e8; border-radius: 4px; margin-top: 12px; }
    /* 把手与轨道同色 + 极低对比，易导致 round-trip / 精灵提取失败 */
    #slider-thumb { position: absolute; left: 0; top: 0; width: 40px; height: 40px; background: #e8e8e8; border: 1px solid #e0e0e0; border-radius: 4px; color: transparent; }
    .ok { color: #389e0d; display: none; margin-top: 12px; }
    .hint { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div id="challenge-box">
    <p>低对比把手：round-trip 可能失败</p>
    <p class="hint">应不进 interrupt（visual-safe 硬门槛）</p>
    <div id="slider-track">
      <div id="slider-thumb" role="slider">H</div>
    </div>
    <p class="ok" id="success-msg">验证通过</p>
  </div>
</body>
</html>
