<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Puzzle Gap Slider</title>
  <style>
    #challenge-box { width: 340px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
    #slider-track {
      position: relative; height: 44px; margin-top: 12px; border-radius: 4px;
      background: linear-gradient(90deg, #cfd8dc 0%, #cfd8dc 58%, transparent 58%, transparent 68%, #cfd8dc 68%);
    }
    #slider-thumb { position: absolute; left: 0; top: 2px; width: 44px; height: 40px; background: #1677ff; border-radius: 4px; cursor: grab; color: #fff; line-height: 40px; text-align: center; }
    #slider-fill { position: absolute; left: 0; top: 2px; height: 40px; width: 0; background: rgba(22,119,255,0.25); pointer-events: none; }
    .ok { color: #389e0d; display: none; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="challenge-box">
    <p>缺口滑块：将滑块拖入缺口位置（约 62% 处）</p>
    <div id="slider-track">
      <div id="slider-fill"></div>
      <div id="slider-thumb" role="slider">▣</div>
    </div>
    <p class="ok" id="success-msg">验证通过</p>
  </div>
  <script>
    (function () {
      var track = document.getElementById("slider-track");
      var thumb = document.getElementById("slider-thumb");
      var fill = document.getElementById("slider-fill");
      var maxX = track.clientWidth - thumb.clientWidth;
      var target = maxX * 0.62;
      var dragging = false, startX = 0, startLeft = 0;
      function setPos(x) {
        var left = Math.max(0, Math.min(x, maxX));
        thumb.style.left = left + "px";
        fill.style.width = (left + thumb.clientWidth / 2) + "px";
        if (Math.abs(left - target) <= 6) {
          document.getElementById("success-msg").style.display = "block";
        }
      }
      thumb.addEventListener("mousedown", function (e) { dragging = true; startX = e.clientX; startLeft = parseInt(thumb.style.left || "0", 10); e.preventDefault(); });
      document.addEventListener("mousemove", function (e) { if (!dragging) return; setPos(startLeft + e.clientX - startX); });
      document.addEventListener("mouseup", function () { dragging = false; });
    })();
  </script>
</body>
</html>
