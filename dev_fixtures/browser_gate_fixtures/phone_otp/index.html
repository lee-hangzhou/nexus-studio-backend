<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Phone OTP Gate Fixture</title>
</head>
<body>
  <div id="phone-step">
    <label>手机号 <input id="phone" type="tel" placeholder="13800138000" /></label>
    <button id="send-code" type="button">发送验证码</button>
  </div>
  <div id="code-step" hidden>
    <label>验证码 <input id="code" type="text" maxlength="6" /></label>
    <button id="submit-code" type="button">登录</button>
  </div>
  <div id="logged-in" hidden>已登录</div>
  <script>
    window.SEND_CODE_CALL_COUNT = 0;
    document.getElementById("send-code").addEventListener("click", function () {
      window.SEND_CODE_CALL_COUNT += 1;
      document.getElementById("phone-step").hidden = true;
      document.getElementById("code-step").hidden = false;
    });
    document.getElementById("submit-code").addEventListener("click", function () {
      var code = document.getElementById("code").value.trim();
      if (code === "123456") {
        document.getElementById("code-step").hidden = true;
        document.getElementById("logged-in").hidden = false;
      } else {
        alert("验证码错误（fixture: 123456）");
      }
    });
  </script>
</body>
</html>
