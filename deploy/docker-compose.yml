name: dream-drama-prod

services:
  frontend:
    container_name: dream-drama-prod-frontend
    image: ${FRONTEND_IMAGE:-dream-drama-prod-frontend:latest}
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:82}:80"
    depends_on:
      - backend
    networks:
      - dream-drama-network
    restart: unless-stopped

  backend:
    container_name: dream-drama-prod-backend
    image: ${BACKEND_IMAGE:-dream-drama-prod-backend:latest}
    env_file:
      - ${BACKEND_ENV_FILE:-.env.prod}
    environment:
      # Browser 子容器必须加入 backend 所在的固定网络，才能通过容器 DNS 通信。
      CHAT_BROWSER_DOCKER_NETWORK: ${DEPLOY_NETWORK:-dream-drama-network}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 与 CHAT_WORKSPACE_ROOT 同路径，供 backend 内 docker run -v 挂载到宿主机
      - /var/lib/dream-drama/chat-workspaces:/var/lib/dream-drama/chat-workspaces
      - /var/lib/dream-drama/sandbox-packages:/var/lib/dream-drama/sandbox-packages
    networks:
      - dream-drama-network
      - union-lm-network
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dream-drama-network:
    name: ${DEPLOY_NETWORK:-dream-drama-network}
    driver: bridge
  union-lm-network:
    external: true
    name: union-lm-network
