[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus_studio"
version = "0.1.0"
description = "nexus-studio"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = [
    "app/chat/browser/tests",
    "deploy/browser-session",
]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: live gateway integration tests (uses existing GATEWAY_* from .env)",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "deploy/*/test_*.py"]

[tool.ruff]
line-length = 120
extend-exclude = ["app/chat/skills"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "B008",   # function-call-in-default-argument (common with Depends)
    "UP006",  # use-standard-type-annotations (prefer List over list for clarity)
    "UP007",  # use-union-syntax (prefer Optional/Union over |)
    "UP035",  # deprecated-import (prefer typing.List/Optional for compatibility)
    "UP045",  # use-none-syntax (prefer Optional[X] over X | None)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"scripts/export_contracts.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = "^app/chat/skills/.*/scripts/"
